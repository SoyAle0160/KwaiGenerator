name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir tu archivo ZIP automaticamente
        run: |
          echo "Buscando el archivo ZIP..."
          unzip -q *.zip -d project_source

      - name: Compilar APK de depuracion
        run: |
          cd project_source
          if [ -d "KwaiGenerator3000" ]; then
            cd KwaiGenerator3000
          fi
          gradle assembleDebug --no-daemon

      - name: Guardar el APK resultante
        uses: actions/upload-artifact@v4
        with:
          name: KwaiGenerator3000-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
